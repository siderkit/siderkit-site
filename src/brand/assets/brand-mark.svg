<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Siderkit">
  <!--
    Siderkit monogram, same geometry as the app's .l-logo-mark:
    radius = 30% of the side, bold S at 60% of the side.
    Colors: brand (hsl 0 0% 8%) background, on-brand letter.
  -->
  <rect width="32" height="32" rx="9.6" fill="#141414" />
  <text
    x="16"
    y="22.9"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19.2"
    font-weight="700"
    fill="#ffffff">S</text>
</svg>
